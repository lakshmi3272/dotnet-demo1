name: .NET CI - Lint, Test, Build and Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-run:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Self-Hosted Runner
        run: |
          hostname
          whoami
          pwd
          dotnet --version

      - name: Restore Dependencies
        run: |
          dotnet restore dotnet-demo1.csproj
          dotnet restore dotnet-demo1.Tests/dotnet-demo1.Tests.csproj

      - name: Lint Check
        run: dotnet format dotnet-demo1.csproj --verify-no-changes

      - name: Run Unit Tests
        run: |
          dotnet test dotnet-demo1.Tests/dotnet-demo1.Tests.csproj \
            --configuration Release \
            --logger "console;verbosity=normal"

      - name: Build Application
        run: dotnet build dotnet-demo1.csproj --configuration Release --no-restore

      - name: Run Application
        run: dotnet run --project dotnet-demo1.csproj --configuration Release --no-build